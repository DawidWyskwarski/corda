[versions]
# Build tooling
agp = "9.4.0"
kotlin = "2.4.20" # also drives the Compose + serialization compiler plugins; keep them in sync
ksp = "2.3.11"

# AndroidX platform
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"

# Compose
composeBom = "2026.08.00"
material3 = "1.5.0-alpha27" # BOM ships stable 1.4.0; we pin 1.5 alpha for Expressive APIs (ButtonGroup, FAB menu)
nav3Core = "1.1.7"

# Kotlin libraries
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"

# Data / DI / audio
room = "2.8.4"
datastore = "1.2.1"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
tarsos = "2.5"

# Testing
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"

[libraries]
# --- AndroidX platform ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" } # Kotlin extensions for Android framework APIs.
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" } # Lifecycle-aware helpers for collecting state in Compose.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" } # Hosts Compose UI inside an Activity.

# --- Compose UI ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" } # Aligns versions of all Compose libraries.
androidx-compose-ui = { module = "androidx.compose.ui:ui" } # Core Compose UI toolkit.
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" } # Drawing and graphics primitives for Compose.
androidx-compose-ui-text = { module = "androidx.compose.ui:ui-text" } # Text styling and measurement for Compose.
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" } # Material 3 UI components.
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" } # Full Material icon set.
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" } # Enables @Preview annotations.
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" } # Interactive previews and layout inspection. Debug-only.
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" } # JUnit4 APIs for Compose UI tests.
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" } # Manifest needed to host Compose UI tests.

# --- Navigation 3 ---
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" } # Back-stack model for Navigation 3.
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" } # UI layer for displaying Navigation 3 destinations.
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" } # Scopes ViewModels to Navigation 3 destinations.

# --- Kotlin libraries ---
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" } # Coroutines support for Android, including the main dispatcher.
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" } # Serializes Kotlin objects to and from structured data.

# --- Persistence ---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" } # SQLite ORM runtime.
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" } # Generates Room database and DAO implementations.
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" } # Key-value storage for small app preferences.

# --- Dependency injection ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" } # Hilt dependency injection runtime.
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" } # Generates the Hilt component graph.
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" } # Provides Hilt ViewModels to Compose destinations.

# --- Audio ---
tarsos-core = { module = "be.tarsos.dsp:core", version.ref = "tarsos" } # Audio analysis library used for pitch detection.

# --- Testing ---
junit = { module = "junit:junit", version.ref = "junit" } # Local unit-test runner.
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" } # JUnit runner for instrumented Android tests.

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" } # Builds an Android application module.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } # Kotlin compiler plugin for Compose.
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" } # Kotlin compiler plugin for serialization.
google-dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" } # Applies Hilt to the Android app.
google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" } # Runs Kotlin annotation processors such as Room and Hilt.
